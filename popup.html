<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hinglish Reader</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { width: 312px; background: var(--surface); }

    .head {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .mark {
      width: 24px;
      height: 24px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }
    .head h1 {
      font-size: 13.5px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .head .gear {
      margin-left: auto;
      color: var(--faint);
      font-size: 12px;
      padding: 5px 8px;
      border-radius: var(--r-sm);
    }
    .head .gear:hover { color: var(--text); background: var(--surface-2); text-decoration: none; }

    .body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      padding: 14px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid var(--border);
    }
    .status-label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
    .dot {
      width: 6px; height: 6px; flex: none;
      border-radius: 50%;
      background: var(--border-strong);
    }
    .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); }

    .stack { display: flex; flex-direction: column; gap: 8px; }

    .meta {
      font-size: 11px;
      line-height: 1.4;
      color: var(--faint);
    }
    .meta b { color: var(--muted); font-weight: 600; }

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px 13px;
    }
    .foot .btn { flex: none; color: var(--faint); font-size: 11.5px; }
    .foot .btn:hover:not(:disabled) { color: var(--danger); background: var(--danger-soft); }
  </style>
</head>
<body>
  <header class="head">
    <div class="mark" aria-hidden="true">H</div>
    <h1>Hinglish Reader</h1>
    <a href="#" id="settingsLink" class="gear">Settings</a>
  </header>

  <div class="body">
    <div id="blockedWrap" style="display:none;">
      <div id="blockedNotice" class="notice"></div>
    </div>

    <div class="card">
      <button id="toggleBtn" type="button" class="btn btn-primary btn-block">
        Convert to Hinglish
      </button>

      <div class="status" id="statusRow">
        <span class="status-label">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Off</span>
        </span>
        <button id="restoreBtn" type="button" class="btn btn-ghost">Restore original</button>
      </div>
    </div>

    <div class="card">
      <p class="eyebrow">PDF</p>
      <div class="stack">
        <button id="pdfBtn" type="button" class="btn btn-secondary btn-block" style="display:none;">
          Open this PDF in reader
        </button>
        <button id="openReaderBtn" type="button" class="btn btn-secondary btn-block">
          Open PDF reader
        </button>
      </div>
      <p class="desc" style="font-size:11.5px;">Drag and drop any PDF to read it in Hinglish.</p>
    </div>
  </div>

  <div class="foot">
    <span class="meta" id="metaInfo"></span>
    <button id="offSiteBtn" type="button" class="btn btn-ghost">Disable on this site</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
