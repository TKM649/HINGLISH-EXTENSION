<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Hinglish Reader: English pages and PDFs in easy Hinglish">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="160" fill="#ffffff" opacity="0.06"/>
  <circle cx="60" cy="400" r="120" fill="#ffffff" opacity="0.05"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="64" y="64" width="72" height="72" rx="18" fill="#ffffff"/>
    <text x="100" y="114" text-anchor="middle" font-size="40" font-weight="800" fill="#4f46e5">H</text>
    <text x="160" y="112" font-size="46" font-weight="800" fill="#ffffff">Hinglish Reader</text>
    <text x="66" y="190" font-size="26" font-weight="500" fill="#e0e7ff">Read English web pages and PDFs in easy, everyday Hinglish.</text>
    <text x="66" y="226" font-size="20" fill="#c7d2fe">Free Chrome extension · One click to convert, one click to restore</text>

    <g filter="url(#sh)">
      <rect x="64" y="262" width="1072" height="128" rx="16" fill="#ffffff"/>
    </g>
    <text x="96" y="302" font-size="15" font-weight="700" fill="#6b7280" letter-spacing="1">ENGLISH</text>
    <text x="96" y="346" font-size="21" fill="#1f2937">Most people use ChatGPT like a search box.</text>
    <text x="560" y="340" font-size="30" fill="#a5b4fc">→</text>
    <text x="610" y="302" font-size="15" font-weight="700" fill="#4f46e5" letter-spacing="1">HINGLISH</text>
    <text x="610" y="336" font-size="21" fill="#1f2937">Zyadatar log ChatGPT ko search box ki</text>
    <text x="610" y="362" font-size="21" fill="#1f2937">tarah use karte hain.</text>
  </g>
</svg>
