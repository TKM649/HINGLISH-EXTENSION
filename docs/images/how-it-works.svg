<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="How it works: open an English page, click Convert, read in Hinglish">
  <style>
    .t{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#111827}
    .s{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#4b5563}
    .n{font:800 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#fff}
  </style>
  <rect width="1200" height="300" rx="20" fill="#f5f3ff"/>

  <!-- Step 1 -->
  <rect x="40" y="40" width="340" height="220" rx="16" fill="#fff" stroke="#e0e7ff" stroke-width="2"/>
  <circle cx="80" cy="80" r="18" fill="#4f46e5"/><text class="n" x="80" y="86" text-anchor="middle">1</text>
  <rect x="250" y="62" width="96" height="70" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <rect x="262" y="76" width="56" height="7" rx="3" fill="#a5b4fc"/>
  <rect x="262" y="91" width="72" height="5" rx="2" fill="#c7d2fe"/>
  <rect x="262" y="102" width="64" height="5" rx="2" fill="#c7d2fe"/>
  <rect x="262" y="113" width="70" height="5" rx="2" fill="#c7d2fe"/>
  <text class="t" x="70" y="185">Open any page</text>
  <text class="s" x="70" y="215">An English article, blog,</text>
  <text class="s" x="70" y="238">news site or PDF book.</text>

  <path d="M392 150 h26" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round"/>
  <path d="M412 140 l10 10 l-10 10" fill="none" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="430" y="40" width="340" height="220" rx="16" fill="#fff" stroke="#e0e7ff" stroke-width="2"/>
  <circle cx="470" cy="80" r="18" fill="#4f46e5"/><text class="n" x="470" y="86" text-anchor="middle">2</text>
  <rect x="640" y="62" width="54" height="54" rx="14" fill="#4f46e5"/>
  <text x="667" y="100" text-anchor="middle" style="font:800 28px -apple-system,Segoe UI,Roboto,Arial,sans-serif;fill:#fff">H</text>
  <path d="M700 108 l18 30 l-8 -2 l6 12 l-6 3 l-6 -12 l-6 6 z" fill="#111827"/>
  <text class="t" x="460" y="185">Click Convert</text>
  <text class="s" x="460" y="215">Tap the H icon in your</text>
  <text class="s" x="460" y="238">toolbar. One click.</text>

  <path d="M782 150 h26" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round"/>
  <path d="M802 140 l10 10 l-10 10" fill="none" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="820" y="40" width="340" height="220" rx="16" fill="#fff" stroke="#e0e7ff" stroke-width="2"/>
  <circle cx="860" cy="80" r="18" fill="#4f46e5"/><text class="n" x="860" y="86" text-anchor="middle">3</text>
  <rect x="1030" y="62" width="96" height="70" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <rect x="1042" y="76" width="56" height="7" rx="3" fill="#34d399"/>
  <rect x="1042" y="91" width="72" height="5" rx="2" fill="#a7f3d0"/>
  <rect x="1042" y="102" width="64" height="5" rx="2" fill="#a7f3d0"/>
  <rect x="1042" y="113" width="70" height="5" rx="2" fill="#a7f3d0"/>
  <text class="t" x="850" y="185">Read in Hinglish</text>
  <text class="s" x="850" y="215">Links and formatting stay.</text>
  <text class="s" x="850" y="238">One click restores English.</text>
</svg>
